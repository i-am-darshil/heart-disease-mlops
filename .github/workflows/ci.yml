# CI pipeline. Grows phase by phase:
#   lint -> test -> train -> api-image (build + smoke test)
#                \-> reproduce
# Pushing the image to a registry and deploying come in Phases 6-7.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint  # only runs if lint passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: pytest --cov=heart --cov-report=xml --junitxml=reports/junit.xml
      - name: Upload test reports
        if: always()  # upload even when tests fail, so the logs are inspectable
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/junit.xml
            coverage.xml

  train:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      # Exits non-zero if the quality gate fails, which fails this job and the whole run.
      # Every run (passed or failed) is logged to a fresh MLflow store on the runner.
      - run: python -m heart.train
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
      - name: Upload model and evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: |
            models/model.joblib
            models/model_metadata.json
            models/metrics.json
            reports/figures/model_*.png
      # The runner is wiped after the job, so keep its MLflow store. Download it and run
      # `mlflow ui --backend-store-uri sqlite:///mlflow.db` to browse this CI run's experiments.
      - name: Upload MLflow tracking store
        if: always()  # keep the record of failed runs too
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-${{ github.sha }}
          path: |
            mlflow.db
            mlartifacts/

  # Trains twice from scratch on a fresh runner and fails unless both models are
  # byte-identical with identical predictions and metrics.
  reproduce:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m heart.reproduce

  # Builds the serving image with the model trained above, runs it, and checks every
  # endpoint answers correctly. Proves the container works in isolation.
  api-image:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the trained model
        uses: actions/download-artifact@v4
        with:
          name: model-${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: serve
          tags: heart-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d --name api -p 8000:8000 heart-api:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf localhost:8000/ready && exit 0
            sleep 1
          done
          docker logs api; exit 1
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -sf localhost:8000/health
          body=$(curl -sf -X POST localhost:8000/predict \
            -H 'Content-Type: application/json' -d @examples/sample_request.json)
          echo "$body"
          echo "$body" | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['prediction'] in (0,1) and 0<=r['probability']<=1"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/predict \
            -H 'Content-Type: application/json' -d '{"age": 500}')
          test "$code" = 422
          curl -sf localhost:8000/metrics | grep -q heart_predictions_total
      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tail -50
