# `helm test <release>` runs this pod inside the cluster: it calls the Service and
# fails unless /ready is up and /predict returns a valid prediction.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "heart-api.fullname" . }}-test-predict
  labels:
    {{- include "heart-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: test
      # Same image as the API: it has Python, so no extra image to pull
      image: "{{ .Values.image.repository }}:{{ include "heart-api.tag" . }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          base = "http://{{ include "heart-api.fullname" . }}:{{ .Values.service.port }}"
          ready = json.load(urllib.request.urlopen(base + "/ready", timeout=10))
          assert ready["model_loaded"], ready
          body = json.dumps({"age": 67, "sex": 1, "cp": 4, "trestbps": 160, "chol": 286,
                             "fbs": 0, "restecg": 2, "thalach": 108, "exang": 1,
                             "oldpeak": 1.5, "slope": 2, "ca": 3, "thal": 3}).encode()
          req = urllib.request.Request(base + "/predict", body, {"Content-Type": "application/json"})
          result = json.load(urllib.request.urlopen(req, timeout=10))
          assert result["prediction"] in (0, 1) and 0 <= result["probability"] <= 1, result
          print("OK", ready["model_version"], result["label"], result["probability"])
