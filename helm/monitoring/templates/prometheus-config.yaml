apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.scrapeInterval }}
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      # Prometheus's own health (it serves under /prometheus, see the Deployment)
      - job_name: prometheus
        metrics_path: /prometheus/metrics
        static_configs:
          - targets: [localhost:9090]
      # Every pod annotated prometheus.io/scrape: "true" in the watched namespaces.
      # Pods come and go (rollouts, scaling); Kubernetes service discovery tracks them.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: {{ .Values.scrapeNamespaces | toJson }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed
            action: drop
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: (.+)
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: (.+);(\d+)
            replacement: $1:$2
            target_label: __address__
          # job = the app's name (heart-api), so queries read up{job="heart-api"}
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: (.+)
            target_label: job
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # The deployed image tag (commit), to compare versions side by side during a rollout
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
            target_label: version
  alerts.yml: |
    {{- .Files.Get "files/alerts.yml" | nindent 4 }}
