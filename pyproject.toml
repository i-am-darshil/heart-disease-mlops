[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart"
version = "0.1.0"
description = "Heart disease risk classifier with an end-to-end MLOps pipeline"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes basics, I: import sorting, B: common bug patterns, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Raised inside MLflow's own SQLAlchemy store, not our code
    "ignore::DeprecationWarning:mlflow.*",
    "ignore:.*noload.*:DeprecationWarning",
]
